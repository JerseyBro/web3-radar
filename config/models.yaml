# Model strategy — multi-provider, config-first, provider-agnostic
# Backward compatible: legacy flat classifier/synthesis still works (treated as openai).

# ── Providers ───────────────────────────────────────────────────
# Each provider: type + base_url + api_key_env (env var name, never the key itself).
# To use a provider, set its api_key_env in Keychain / .env / GitHub Secrets.
# Only referenced providers' keys are REQUIRED; others are OPTIONAL/UNUSED.
providers:
  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  deepseek:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  alibaba:
    type: openai_compatible
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  tencent:
    type: openai_compatible
    base_url: https://api.hunyuan.cloud.tencent.com/v1
    api_key_env: TENCENT_LLM_API_KEY
  volcengine:
    type: openai_compatible
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: VOLCENGINE_API_KEY
  opencode_go:
    type: openai_compatible
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
  generic:
    type: openai_compatible
    base_url: ""
    api_key_env: CUSTOM_LLM_API_KEY
  google:
    type: openai_compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY

# ── Roles (unified — business code calls role, not provider) ────
roles:
  classifier:
    primary:
      provider: deepseek
      model: deepseek-flash
    fallback: null
  synthesis:
    primary:
      provider: deepseek
      model: deepseek-flash
    fallback: null

# ── Push feature flags ──────────────────────────────────────────
push:
  weekly_enabled: true
  critical_enabled: false

# ── Cost control ────────────────────────────────────────────────
monthly_ai_budget_usd: 5
max_ai_calls_per_run: 20
max_weekly_input_events: 80

# ── Pricing per 1M tokens (USD) ─────────────────────────────────
# Conservative public list prices for the default and optional fallback models, per 1M tokens.
# DeepSeek Flash uses peak, cache-miss rates. Check official prices before
# changing models; the live pipeline skips AI when any configured role model
# lacks a pricing entry, while deterministic reporting continues.
pricing:
  deepseek-flash:
    input: 0.30
    output: 1.20
  gpt-6-luna:
    input: 0.10
    output: 0.50
