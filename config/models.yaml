classifier_model: "gpt-5.6-luna"
synthesis_model: "gpt-5.6-terra"
deep_model: "gpt-5.6-sol"
deep_model_enabled: false

# Cost control
monthly_ai_budget_usd: 5
max_ai_calls_per_run: 20
max_weekly_input_events: 80

# Pricing per 1M tokens (USD)
pricing:
  gpt-5.6-luna:
    input: 1.0
    output: 4.0
  gpt-5.6-terra:
    input: 2.0
    output: 8.0
  gpt-5.6-sol:
    input: 5.0
    output: 15.0
  # fallback
  gpt-4o-mini:
    input: 0.15
    output: 0.6

# Override for testing / fallback when models not available
fallback_models:
  classifier: "gpt-4o-mini"
  synthesis: "gpt-4o-mini"
