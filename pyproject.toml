[project]
name = "web3-intelligence-radar"
version = "1.0.0"
description = "Web3 Wallet AI Intelligence Radar"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.0",
  "trafilatura>=1.8.0",
  "rapidfuzz>=3.9.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["radar", "collectors", "pipeline", "radars", "outputs", "storage"]
