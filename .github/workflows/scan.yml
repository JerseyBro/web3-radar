name: Radar Scan
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      radar:
        description: "industry|competitor|all"
        required: false
        default: "all"
      mode:
        description: "scan|dry-run"
        required: false
        default: "scan"
      push:
        description: "deliver external messages (default false)"
        required: false
        default: false
        type: boolean

# Serialize all runs that touch persistent state.
concurrency:
  group: web3-radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e .
      - name: Run scan (state persisted to radar-state branch)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TENCENT_LLM_API_KEY: ${{ secrets.TENCENT_LLM_API_KEY }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          LARK_WEBHOOK_INDUSTRY: ${{ secrets.LARK_WEBHOOK_INDUSTRY }}
          LARK_WEBHOOK_COMPETITOR: ${{ secrets.LARK_WEBHOOK_COMPETITOR }}
          LARK_SIGNING_SECRET_INDUSTRY: ${{ secrets.LARK_SIGNING_SECRET_INDUSTRY }}
          LARK_SIGNING_SECRET_COMPETITOR: ${{ secrets.LARK_SIGNING_SECRET_COMPETITOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTHLY_AI_BUDGET_USD: "5"
          MAX_AI_CALLS_PER_RUN: "20"
        run: |
          RADAR="${{ inputs.radar || 'all' }}"
          MODE="${{ inputs.mode || 'scan' }}"
          PUSH="${{ inputs.push }}"
          EXTRA=""
          if [ "$MODE" = "dry-run" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ "$PUSH" = "true" ]; then EXTRA="$EXTRA --push"; fi
          python -m radar scan --radar $RADAR $EXTRA
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-run-summary
          path: |
            reports/*.json
          if-no-files-found: ignore
          retention-days: 14
